name: PR checks — typecheck · unit · contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          INKBOX_SDK_PATH="$(bash tests/ci/candidate_sdk.sh)"
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" ci
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" install --no-save --package-lock=false \
            "$INKBOX_SDK_PATH" \
            @opencode-ai/sdk@1.17.18 @opencode-ai/plugin@1.17.18
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest tests/live/test_a2a_preflight.py
      - run: npm run build

  # Same contract suite canary runs on a schedule, but here it gates PRs so a
  # host bump that breaks the plugin interface is visible at review time.
  contract-latest:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: |
          INKBOX_SDK_PATH="$(bash tests/ci/candidate_sdk.sh)"
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" ci
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" install --no-save --package-lock=false \
            "$INKBOX_SDK_PATH" \
            @opencode-ai/sdk@1.17.18 @opencode-ai/plugin@1.17.18
      - run: |
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" install --no-save --package-lock=false \
            "$INKBOX_SDK_PATH" \
            @opencode-ai/sdk@latest @opencode-ai/plugin@latest
      - run: npm run typecheck
      - run: npx vitest run tests/contract

  loader-smoke:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: |
          INKBOX_SDK_PATH="$(bash tests/ci/candidate_sdk.sh)"
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" ci
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" install --no-save --package-lock=false \
            "$INKBOX_SDK_PATH" \
            @opencode-ai/sdk@1.17.18 @opencode-ai/plugin@1.17.18
      - name: Install minimum native host
        run: bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" install -g opencode-ai@1.15.0
      - name: Packed native loader on minimum host
        run: |
          test "$(opencode --version)" = "1.15.0"
          bash scripts/smoke-loader.sh
      - name: Install recent V1 host
        run: bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" install -g opencode-ai@1.19.0
      - name: Packed native loader on recent V1 host
        run: bash scripts/smoke-loader.sh

  loader-v2:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        version: ["2.0.26", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: |
          INKBOX_SDK_PATH="$(bash tests/ci/candidate_sdk.sh)"
          bash tests/ci/npm_with_retry.sh ci
      - run: bash tests/ci/npm_with_retry.sh install -g @opencode/cli@${{ matrix.version }}
      - run: npm run build
      - name: Packed V2 host contract
        run: |
          ARCHIVE=$(npm pack --silent | tail -1)
          node scripts/smoke-v2.mjs "$ARCHIVE"

  sdk-compatibility:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install candidate-aware dependency graph, then the historical SDK boundary
        run: |
          INKBOX_SDK_PATH="$(bash tests/ci/candidate_sdk.sh)"
          bash tests/ci/npm_with_retry.sh ci
          bash tests/ci/npm_with_retry.sh install --no-save --package-lock=false @inkbox/sdk@0.7.15 @opencode-ai/sdk@1.17.18 @opencode-ai/plugin@1.17.18
      - name: Verify historical base behavior without claiming WhatsApp support
        run: npx vitest run tests/unit/client.test.ts tests/unit/config.test.ts tests/unit/registry.test.ts tests/unit/send-email.test.ts tests/unit/send-sms.test.ts tests/unit/send-imessage.test.ts tests/unit/imessage-reads.test.ts tests/unit/vault.test.ts
