name: Canary — plugin vs opencode latest

on:
  workflow_call:
  workflow_dispatch:

jobs:
  contract:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: |
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" ci
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" install --no-save --package-lock=false \
            @inkbox/sdk@0.7.15 \
            @opencode-ai/sdk@latest @opencode-ai/plugin@latest
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  loader-smoke:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: |
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" ci
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" install --no-save --package-lock=false \
            @inkbox/sdk@0.7.15 \
            @opencode-ai/sdk@1.17.18 @opencode-ai/plugin@1.17.18
      - name: Install minimum native host
        run: bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" install -g opencode-ai@1.15.0
      - name: Packed native loader on minimum host
        run: |
          test "$(opencode --version)" = "1.15.0"
          bash scripts/smoke-loader.sh
      - name: Install latest native host
        run: bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" install -g opencode-ai@latest
      - name: Packed native loader on latest host
        run: bash scripts/smoke-loader.sh
