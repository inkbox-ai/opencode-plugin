name: Live — voice calls (Voice AI + Realtime + Inkbox TTS/STT)

# Boots the AUT gateway plus a driver process that bridges the other side of a
# real phone call over its own Inkbox tunnel. Three available matrix legs:
#   inbound_inkbox    — driver calls the agent; agent answers Inkbox STT/TTS.
#   outbound_realtime — driver texts "call me"; agent calls back on Realtime.
#   outbound_hosted   — driver requests a Voice AI call and one exact post-call SMS.
# Each leg verifies the stored call transcript shows the agent spoke to the
# caller. Real model + real calls — the priciest suite — so it runs only on
# ready (non-draft) PRs + manual dispatch, and shares the AUT tunnel lock.
on:
  workflow_call:
    inputs:
      timeout_s:
        description: "Seconds to wait for the call/transcript"
        required: false
        type: string
        default: "220"
      orchestrated:
        description: "True when the full-stack workflow owns the shared live lock"
        required: false
        type: boolean
        default: false
      include_inbound:
        description: "Run the carrier-dependent inbound PSTN diagnostic"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      timeout_s:
        description: "Seconds to wait for the call/transcript"
        default: "220"
      include_inbound:
        description: "Run the carrier-dependent inbound PSTN diagnostic"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Same group as the other live suites: only one holder of the AUT tunnel.
  group: ${{ inputs.orchestrated && format('inkbox-live-child-{0}', github.run_id) || 'inkbox-live-aut-tunnel' }}
  cancel-in-progress: false
  queue: max

jobs:
  voice:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1          # legs share the AUT + driver identities → one at a time
      matrix:
        scenario: ${{ fromJSON(inputs.include_inbound && '["inbound_inkbox","outbound_realtime","outbound_hosted"]' || '["outbound_realtime","outbound_hosted"]') }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: |
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" ci
          bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" install --no-save --package-lock=false \
            @inkbox/sdk@0.5.9 \
            @opencode-ai/sdk@1.17.18 @opencode-ai/plugin@1.17.18
      - run: bash "$GITHUB_WORKSPACE/tests/ci/npm_with_retry.sh" install -g opencode-ai@latest

      - name: Boot the AUT gateway (voice; ${{ matrix.scenario }})
        env:
          MODE: real
          AUT_INKBOX_API_KEY: ${{ secrets.AUT_INKBOX_API_KEY }}
          AUT_INKBOX_SIGNING_KEY: ${{ secrets.AUT_INKBOX_SIGNING_KEY }}
          INKBOX_BASE_URL: ${{ vars.INKBOX_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INKBOX_VOICE_ENABLED: "true"
          INKBOX_VOICE_STACK: ${{ matrix.scenario == 'outbound_hosted' && 'inkbox_voice_ai' || (matrix.scenario == 'outbound_realtime' && 'openai_realtime' || 'inkbox_tts_stt') }}
          INKBOX_VOICEMAIL_DETECTION: "disabled"
          INKBOX_REALTIME_ENABLED: ${{ matrix.scenario == 'outbound_realtime' && 'true' || 'false' }}
          INKBOX_REALTIME_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INKBOX_REALTIME_MODEL: gpt-realtime-2
        run: bash scripts/live-aut.sh

      - name: Start the voice driver and wait for its tunnel
        env:
          REMOTE_INKBOX_API_KEY: ${{ secrets.REMOTE_INKBOX_API_KEY }}
          INKBOX_BASE_URL: ${{ vars.INKBOX_BASE_URL }}
          VOICE_DRIVER_STATE: ${{ runner.temp }}/voice_driver_state.json
        run: |
          if [ "${{ matrix.scenario }}" = "outbound_hosted" ]; then
            HOSTED_MARKER="$(node scripts/nato-marker.mjs "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
            echo "HOSTED_POST_CALL_MARKER=$HOSTED_MARKER" >> "$GITHUB_ENV"
            export VOICE_DRIVER_LINE="Do not text during this call. After we hang up, send me one SMS containing exactly: $HOSTED_MARKER. Save one post-call action now, with both title and details exactly: Send SMS $HOSTED_MARKER. After the tool succeeds, read back the exact three-word SMS body."
            export VOICE_DRIVER_ANSWER_CONTAINS="$HOSTED_MARKER"
            export VOICE_DRIVER_LISTEN=180
            export VOICE_DRIVER_AUTO_STOP=false
          fi
          nohup node tests/live/voice-driver.mjs > "$RUNNER_TEMP/driver.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/driver.pid"
          for _ in $(seq 1 30); do        # up to ~90s
            [ -s "$VOICE_DRIVER_STATE" ] && { echo "driver ready"; exit 0; }
            sleep 3
          done
          echo "::error::driver did not become ready"; exit 1

      - name: Run voice test (${{ matrix.scenario }})
        env:
          AUT_INKBOX_API_KEY: ${{ secrets.AUT_INKBOX_API_KEY }}
          REMOTE_INKBOX_API_KEY: ${{ secrets.REMOTE_INKBOX_API_KEY }}
          INKBOX_BASE_URL: ${{ vars.INKBOX_BASE_URL }}
          LIVE_REAL_MODEL: "1"
          VOICE_SCENARIO: ${{ matrix.scenario }}
          VOICE_DRIVER_STATE: ${{ runner.temp }}/voice_driver_state.json
          LIVE_VOICE_TIMEOUT_S: ${{ inputs.timeout_s || '220' }}
        run: |
          npx vitest run --config vitest.live.config.ts tests/live/voice.test.ts

      - name: Report content-free failure state
        if: failure() || cancelled()
        run: |
          test -s "$AUT_GATEWAY_LOG" && echo "gateway_log=present" || echo "gateway_log=empty"
          test -s "$AUT_SERVE_LOG" && echo "serve_log=present" || echo "serve_log=empty"
          test -s "$RUNNER_TEMP/driver.log" && echo "driver_log=present" || echo "driver_log=empty"
          python3 - <<'PYDIAGNOSTICS'
          import json
          import os
          from pathlib import Path

          driver_path = Path(os.environ["RUNNER_TEMP"]) / "driver.log"
          driver = driver_path.read_text(errors="replace") if driver_path.exists() else ""
          for line in driver.splitlines():
              if not line.startswith("voice_driver_state="):
                  continue
              try:
                  state = json.loads(line.split("=", 1)[1])
              except ValueError:
                  continue
              if not isinstance(state, dict):
                  continue
              if state.get("reason") not in {"request_spoken", "greeting_timeout", "socket_closed"}:
                  continue
              safe = {"reason": state["reason"]}
              for key in ("partialFrames", "finalFrames", "emptyFrames", "utterances"):
                  if type(state.get(key)) is int and state[key] >= 0:
                      safe[key] = state[key]
              print("voice_driver_state=" + json.dumps(safe, sort_keys=True))
          print("driver_error_count=" + str(driver.count("WS loop ended:") + driver.count("Error:")))
          gateway_path = Path(os.environ["AUT_GATEWAY_LOG"])
          gateway = gateway_path.read_text(errors="replace") if gateway_path.exists() else ""
          for event in ("call.upgrade", "call.connected", "call.mode", "call.transcript", "call.reply", "call.turn_failed", "call.bad_signature", "call.failed"):
              print(event + "=" + str(gateway.count(event)))
          PYDIAGNOSTICS

      - name: Tear down (always)
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/driver.pid" 2>/dev/null)" 2>/dev/null || true
          kill "$AUT_GATEWAY_PID" 2>/dev/null || true
          kill "$AUT_SERVE_PID" 2>/dev/null || true
          sleep 3   # let the driver revert its number on exit
